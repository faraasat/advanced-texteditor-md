<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="advanced-texteditor-md: an editor window with a toolbar, a mention chip and a Markdown pane">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f17"/><stop offset="1" stop-color="#121b2e"/></linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8dc0ff"/><stop offset="1" stop-color="#4f8cf0"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bcd6ff"/></linearGradient>
    <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6aa9ff" stop-opacity=".30"/><stop offset="1" stop-color="#6aa9ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="gl2" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b58cff" stop-opacity=".16"/><stop offset="1" stop-color="#b58cff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#6aa9ff" fill-opacity=".10"/></pattern>
    <clipPath id="win"><rect x="676" y="40" width="460" height="262" rx="14"/></clipPath>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="900" cy="170" r="300" fill="url(#gl)"/>
  <circle cx="120" cy="300" r="240" fill="url(#gl2)"/>

  <!-- wordmark -->
  <g transform="translate(64 78)">
    <rect width="64" height="64" rx="16" fill="url(#ac)"/>
    <path d="M17 22h30M17 32h30M17 42h18" stroke="#06101f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="47" cy="43" r="9" fill="#06101f"/>
    <path d="m42.8 43 3 3 5.4-6" fill="none" stroke="#8dc0ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="64" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="url(#tx)">advanced-texteditor-md</text>
  <text x="64" y="236" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#a9bad4">You edit rich text. It stores Markdown.</text>
  <g transform="translate(64 262)">
    <rect width="318" height="34" rx="9" fill="#080c14" stroke="#253046"/>
    <text x="16" y="22.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#94a3b8">$ <tspan fill="#e8eef8">npm i advanced-texteditor-md</tspan></text>
  </g>

  <!-- editor window -->
  <rect x="676" y="40" width="460" height="262" rx="14" fill="#131a26" stroke="#2f3d5a"/>
  <g clip-path="url(#win)">
    <rect x="676" y="40" width="460" height="34" fill="#0f1623"/>
    <circle cx="696" cy="57" r="5" fill="#ff7b8e"/><circle cx="714" cy="57" r="5" fill="#ffc978"/><circle cx="732" cy="57" r="5" fill="#6ee7a8"/>
    <!-- toolbar -->
    <rect x="676" y="74" width="460" height="38" fill="#171f30"/>
    <g fill="none" stroke="#a4b2c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <text x="694" y="98" fill="#e8eef8" stroke="none" font-family="ui-sans-serif,Arial" font-size="15" font-weight="800">B</text>
      <text x="718" y="98" fill="#e8eef8" stroke="none" font-family="Georgia,serif" font-size="15" font-style="italic">I</text>
      <text x="738" y="98" fill="#e8eef8" stroke="none" font-family="ui-sans-serif,Arial" font-size="15" text-decoration="underline">U</text>
      <path d="M766 86v14"/>
      <path d="M786 98l4-5 4 5M786 100h8" stroke-width="1.6"/>
      <path d="M812 90h14M812 95h14M812 100h9" stroke-width="1.8"/>
      <path d="M846 91a4 4 0 0 1 5.5 0l1 1a4 4 0 0 1 0 5.5M853 99a4 4 0 0 1-5.5 0l-1-1a4 4 0 0 1 0-5.5" stroke-width="1.6"/>
      <rect x="872" y="90" width="12" height="10" rx="2" stroke-width="1.6"/>
    </g>
    <g font-family="ui-sans-serif,Arial" font-size="11.5" font-weight="700">
      <rect x="956" y="82" width="170" height="22" rx="7" fill="#0b0f17" stroke="#253046"/>
      <rect x="958" y="84" width="54" height="18" rx="5" fill="#6aa9ff"/>
      <text x="985" y="97" text-anchor="middle" fill="#04101f">Write</text>
      <text x="1048" y="97" text-anchor="middle" fill="#94a3b8">Markdown</text>
      <text x="1104" y="97" text-anchor="middle" fill="#94a3b8">Split</text>
    </g>
    <!-- WYSIWYG pane -->
    <g font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
      <text x="696" y="146" font-size="19" font-weight="750" fill="#e8eef8">Release notes</text>
      <text x="696" y="172" font-size="12.5" fill="#c3cfe2">Ping</text>
      <rect x="726" y="159" width="104" height="20" rx="10" fill="#6aa9ff" fill-opacity=".18" stroke="#6aa9ff" stroke-opacity=".55"/>
      <circle cx="738" cy="169" r="4" fill="#6aa9ff"/>
      <text x="748" y="173" font-size="11.5" font-weight="700" fill="#9ec6ff">Ada Lovelace</text>
      <text x="838" y="172" font-size="12.5" fill="#c3cfe2">to review.</text>
      <rect x="696" y="190" width="150" height="7" rx="3.5" fill="#2a374f"/>
      <rect x="696" y="204" width="188" height="7" rx="3.5" fill="#2a374f"/>
      <rect x="696" y="224" width="170" height="52" rx="8" fill="#080c14" stroke="#253046"/>
      <text x="708" y="244" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#ff8bd1">const</text>
      <text x="745" y="244" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#78d2ff">md</text>
      <text x="761" y="244" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#98abc8">=</text>
      <text x="708" y="262" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#9fe8a8">ed.getValue()</text>
    </g>
    <!-- markdown pane -->
    <rect x="902" y="120" width="1" height="182" fill="#253046"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5">
      <text x="918" y="146" fill="#ff8bd1"># <tspan fill="#e8eef8">Release notes</tspan></text>
      <text x="918" y="172" fill="#c3cfe2">Ping <tspan fill="#98abc8">[</tspan><tspan fill="#9ec6ff">@Ada Lovelace</tspan><tspan fill="#98abc8">]</tspan></text>
      <text x="918" y="190" fill="#98abc8">(<tspan fill="#c8b4ff">mention:team-a/p01</tspan>)</text>
      <text x="918" y="208" fill="#c3cfe2">to review.</text>
      <text x="918" y="238" fill="#98abc8">```<tspan fill="#7fe3d4">js</tspan></text>
      <text x="918" y="254" fill="#ff8bd1">const <tspan fill="#78d2ff">md</tspan> <tspan fill="#98abc8">=</tspan></text>
      <text x="918" y="270" fill="#9fe8a8">  ed.getValue()</text>
      <text x="918" y="286" fill="#98abc8">```</text>
    </g>
  </g>
</svg>
