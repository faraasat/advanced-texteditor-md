name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build & size (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 (the unit-test DOM) supports Node ^22.22.2 || ^24.15.0 || >=26. The published
        # package itself has no such requirement; this matrix is the DEVELOPMENT toolchain.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      # Fails when an entry goes over its gzip budget or a lazy chunk becomes eager.
      - name: Size check
        run: npm run size

      # Every export resolves, every subpath loads as ESM and CJS, types resolve for a consumer.
      - name: Check package
        run: npm run check:package

      - name: Verify package contents
        run: npm pack --dry-run
