name: Release

# Releases are deliberate. Nothing publishes on a push to main.
#
#   1. Locally:  npm run release      (standard-version bumps package.json, writes CHANGELOG.md, tags vX.Y.Z)
#   2. Locally:  git push --follow-tags
#   3. This workflow runs on the tag, verifies, publishes to npm with provenance and creates the GitHub Release.
#
# Or run it by hand from the Actions tab (workflow_dispatch) with "dry-run" to build and pack without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify, build and pack only, do not publish"
        required: false
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Verify & publish
    runs-on: ubuntu-latest
    environment: npm-publish

    permissions:
      contents: write
      id-token: write # required for npm provenance

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"
          cache: npm

      - name: Check the tag matches package.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      # Auth is the step most likely to fail, and npm reports an expired or
      # read-only token as a 404 on PUT. Check it before doing any other work.
      - name: Verify npm credentials
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami >/dev/null 2>&1; then
            echo "::error::NPM_TOKEN is missing, expired, or lacks publish rights."
            echo "::error::Create an Automation token at https://www.npmjs.com/settings/~/tokens"
            echo "::error::then update the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "Authenticated to npm as $(npm whoami)"

      - name: Install dependencies
        run: npm ci

      # Everything that can fail must fail BEFORE anything is published.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Size check
        run: npm run size

      - name: Check package
        run: npm run check:package

      - name: Pack (dry run check)
        run: npm pack --dry-run

      - name: Publish to npm (with provenance)
        if: ${{ github.event_name == 'push' || !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
